<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Marble Sort</title>
    <meta name="description" content="Hyper-casual physics marble sorting mobile game with block grid pop, funnel physics, conveyor belt and brick color matching." />
    <meta property="og:title" content="Marble Sort" />
    <meta property="og:description" content="Hyper-casual physics marble sorting mobile game with block grid pop, funnel physics, conveyor belt and brick color matching." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
      @keyframes playMagnetLightning {
        from {
          background-position: 0px 0px;
        }
        to {
          background-position: -312px 0px;
        }
      }
      .animate-magnet-lightning {
        background-image: url(/assets/buttons/magnet_lightning_strip.png) !important;
        background-size: 312px 52px !important;
        background-repeat: no-repeat !important;
        animation: playMagnetLightning 0.42s steps(6) infinite;
        filter: drop-shadow(0 0 16px #00F0FF) drop-shadow(0 0 28px rgba(0, 240, 255, 0.75));
        transform: scale(1.08);
      }

      @keyframes playShuffleLightning {
        from {
          background-position: 0px 0px;
        }
        to {
          background-position: -312px 0px;
        }
      }
      @keyframes shuffleSpinPop {
        0% {
          transform: rotate(0deg) scale(1);
          filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.85));
        }
        50% {
          transform: rotate(180deg) scale(1.18);
          filter: drop-shadow(0 0 20px #FFE500) drop-shadow(0 0 32px rgba(255, 200, 0, 0.85));
        }
        100% {
          transform: rotate(360deg) scale(1);
          filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.85));
        }
      }
      .animate-shuffle-burst {
        background-image: url(/assets/buttons/shuffle_lightning_strip.png) !important;
        background-size: 312px 52px !important;
        background-repeat: no-repeat !important;
        animation: playShuffleLightning 0.36s steps(6) infinite, shuffleSpinPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }
    </style>
  </head>
  <body class="bg-[#56A9B4] overflow-hidden select-none touch-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
